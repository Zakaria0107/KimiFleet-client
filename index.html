<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Per-page SEO tags (title, description, canonical, hreflang, OG/Twitter, JSON-LD) are
       generated from src/seo/routes.ts by scripts/prerender.mjs and inserted here. -->
  <!--app-head-->

  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Performance Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
  <link rel="dns-prefetch" href="https://i.pravatar.cc" />

  <!-- Hero background (LCP image). Must match the import in HeroSection.tsx.
       data-only-page: the prerender script removes the tag from other pages. -->
  <link rel="preload" as="image" type="image/webp" href="/src/assets/hero-keys.webp" fetchpriority="high" data-only-page="home" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#2563eb" />

  <!-- Without JavaScript, framer-motion's entrance animations never run and would leave
       sections at their initial inline style (opacity:0 / translated). Show them as-is. -->
  <noscript>
    <style>
      [style*="opacity:0"] { opacity: 1 !important; }
      [style*="transform"] { transform: none !important; }
    </style>
  </noscript>
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
