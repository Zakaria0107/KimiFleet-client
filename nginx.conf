server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Send redirects as relative Location headers ("/fr/"). This container sits behind the
    # kimifleet.com reverse proxy, so absolute ones would point at http://localhost/.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Language homes: French is the default. Pages are prerendered per language (src/seo/routes.ts).
    location = / {
        return 301 /fr/;
    }
    location = /fr {
        return 301 /fr/;
    }
    location = /en {
        return 301 /en/;
    }

    # Old URLs
    location = /privacy {
        return 301 /fr/confidentialite;
    }

    # Inner pages are canonical without a trailing slash
    location ~ ^/(fr|en)/(.+)/$ {
        return 301 /$1/$2;
    }

    # Prerendered pages: /fr/ -> fr/index.html, /fr/confidentialite -> fr/confidentialite/index.html.
    # Anything else is a real 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
